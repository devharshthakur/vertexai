name: vertexai

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vertexai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vertexai}
      POSTGRES_DB: ${POSTGRES_DB:-vertexai}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - vertexai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-vertexai} -d ${POSTGRES_DB:-vertexai}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  vertexai-pgdata:
